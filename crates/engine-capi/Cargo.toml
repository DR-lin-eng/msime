[package]
name = "msime-engine-capi"
# 自己的版本号，不继承工作区的 0.1.0：C 库按自己的节奏发布，SONAME 另按 ABI 主版本取（见下面的 `package.metadata.capi.library`）。
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# 这个 crate 自己的文件只有维护者的代码，从第一天起就是 MPL-2.0（README 的「许可证」一节）。字段不从工作区继承：工作区的 license 是 GPL-3.0-only。它链接的 msime-engine 在改许可证（引擎库方案的 P2）落地之前仍是 GPL-3.0-only，所以二进制要等 P2 之后才以 MPL-2.0 发布。
license = "MPL-2.0"
description = "C ABI of the 水杉输入法 (Metasequoia IME) input engine: sessions, keys, candidates, selection and learning, as a C library with a header and pkg-config file."
repository.workspace = true
readme = "README.md"

[lib]
# cdylib 与 staticlib 是交给 C 的两种库；rlib 留着是为了工作区里的 Rust 代码（以后的 msime 宿主自用、ABI 测试）能直接链接同一份实现。
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# cargo-c 在工作区里按这个特性认出要按 C 库构建的包（`cargo cbuild`、`cargo cinstall`），它本身不开任何代码。
capi = []

[dependencies]
msime-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

# cargo-c 的配置，见 README 的「构建」一节。
[package.metadata.capi]
min_version = "0.10.26"

[package.metadata.capi.header]
name = "msime_engine"
# 头文件直接装进 includedir，C 里写 `#include <msime_engine.h>`。
subdirectory = false
# 版本号宏会是 crate 版本，与 ABI 版本（`MSIME_ENGINE_ABI_MAJOR`/`MINOR`）不是一回事，不生成，免得采用方拿错。
emit_version_constants = false

[package.metadata.capi.pkg_config]
name = "msime-engine"
filename = "msime-engine"
description = "水杉输入法 (Metasequoia IME) input engine, C ABI"

[package.metadata.capi.library]
name = "msime_engine"
# 库文件的版本取 ABI 版本 `<major>.<minor>.0`，SONAME 只带主版本（`libmsime_engine.so.1`，macOS 的 install name 是 `libmsime_engine.1.dylib`）：同一个 ABI 主版本内只追加，旧的二进制换上新库照样能用。改 `MSIME_ENGINE_ABI_MAJOR`/`MINOR` 时同时改这里，`tests::library_version_follows_the_abi` 核对两者一致。
version = "1.0.0"
version_suffix_components = 1

[lints]
workspace = true
